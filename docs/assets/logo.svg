<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#1b2540"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="42" fill="url(#bg)"/>
  <!-- graph edges -->
  <g stroke="url(#edge)" stroke-width="2.5" opacity="0.85">
    <line x1="60" y1="80" x2="120" y2="60"/>
    <line x1="120" y1="60" x2="182" y2="88"/>
    <line x1="60" y1="80" x2="72" y2="150"/>
    <line x1="120" y1="60" x2="120" y2="128"/>
    <line x1="182" y1="88" x2="168" y2="152"/>
    <line x1="72" y1="150" x2="120" y2="128"/>
    <line x1="120" y1="128" x2="168" y2="152"/>
    <line x1="72" y1="150" x2="118" y2="182"/>
    <line x1="168" y1="152" x2="118" y2="182"/>
  </g>
  <!-- attention pulse ring around the fused/root-cause node -->
  <circle cx="120" cy="128" r="26" fill="none" stroke="#f0abfc" stroke-width="2" opacity="0.55"/>
  <!-- graph nodes -->
  <g>
    <circle cx="60" cy="80" r="9" fill="#5eead4"/>
    <circle cx="120" cy="60" r="9" fill="#5eead4"/>
    <circle cx="182" cy="88" r="9" fill="#5eead4"/>
    <circle cx="72" cy="150" r="9" fill="#a78bfa"/>
    <circle cx="168" cy="152" r="9" fill="#a78bfa"/>
    <circle cx="118" cy="182" r="9" fill="#a78bfa"/>
    <circle cx="120" cy="128" r="12" fill="#f472b6"/>
  </g>
</svg>
